<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#F4F7F6"/>
  <!-- Base -->
  <rect x="80" y="320" width="240" height="40" rx="20" fill="#1E293B"/>
  <!-- Body -->
  <rect x="70" y="80" width="260" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Lid -->
  <rect x="70" y="50" width="260" height="30" rx="16 16 0 0" fill="#5276B8"/>
  <!-- Sensor -->
  <circle cx="200" cy="45" r="12" fill="#1E293B"/>
  <circle cx="200" cy="45" r="6" fill="#9BC38A" opacity="0.8"/>
  <!-- Color strips -->
  <rect x="90" y="120" width="50" height="160" rx="8" fill="url(#blueGrad)"/>
  <rect x="155" y="120" width="50" height="160" rx="8" fill="url(#greenGrad)"/>
  <rect x="220" y="120" width="50" height="160" rx="8" fill="url(#yellowGrad)"/>
  <rect x="285" y="120" width="50" height="160" rx="8" fill="url(#redGrad)"/>
  <!-- Labels -->
  <text x="115" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">PLÁSTICO</text>
  <text x="180" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">ORGÂNICO</text>
  <text x="245" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">PAPEL</text>
  <text x="310" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">METAL</text>
  <!-- Brand -->
  <text x="200" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#475569">Lixo Certo</text>
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5276B8"/>
      <stop offset="100%" stop-color="#3D5A8F"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BC38A"/>
      <stop offset="100%" stop-color="#7BA668"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB91F"/>
      <stop offset="100%" stop-color="#E6A61A"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E86C5C"/>
      <stop offset="100%" stop-color="#C55A4C"/>
    </linearGradient>
  </defs>
</svg>